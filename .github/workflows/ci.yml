name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, also runs the slow full-range (up to 2^25) FFTW comparison.
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cpp:
    name: C++ (${{ matrix.preset }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        preset:
          - gcc-debug
          - gcc-release
          - clang-debug
          - clang-release
          - clang-asan
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang ninja-build libfftw3-dev pkg-config

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # binaryDir in CMakePresets.json is build/<preset>.
      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure --no-tests=error
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  cpp-lint:
    name: C++ format and clang-tidy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang clang-format clang-tidy ninja-build libfftw3-dev pkg-config

      - name: clang-format
        run: git ls-files '*.h' '*.hpp' '*.cpp' '*.cc' | xargs -r clang-format --dry-run --Werror

      # Configuring exports build/clang-debug/compile_commands.json for clang-tidy.
      - name: Configure
        run: cmake --preset clang-debug

      # The library is header-only, so its headers are analysed through the files that include them.
      - name: clang-tidy (tests and library headers)
        run: git ls-files 'tests/*.cpp' | xargs -r clang-tidy -p build/clang-debug --quiet

      - name: clang-tidy (Rust FFI shim)
        run: clang-tidy --quiet bindings/rust/csrc/sleekfft_c.cpp -- -std=c++17 -Iinclude -Ibindings/rust/csrc

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bindings/rust
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ libfftw3-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/rust

      - name: Test
        run: cargo test --locked

  rust-lint:
    name: Rust fmt and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bindings/rust
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ libfftw3-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/rust

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  rust-full-range:
    name: Rust full-range FFTW comparison (2^1..2^25)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bindings/rust
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ libfftw3-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/rust

      - name: Full-range test
        run: cargo test --locked matches_fftw_full_range -- --ignored --nocapture